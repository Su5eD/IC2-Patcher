; electrolyzer recipes
; created 27.11.2026 11:28:13
;
; To change/remove/add/replace recipes, modify this file and put it in the
; "minecraft/config/ic2" folder. Do NOT modify the file inside of the IC2-Patcher jar file.
;
; machine recipes are as follows:
;  <input> = <output 1>[, <output n>..., <output 5>]
;
; input:
;  Fluid:<name>[*<amount>]
;
; output:
;  Fluid:<name>@<direction>[*<amount>]
;
; name references a fluid name for a fluid in the specified format: Fluid:<fluid name>
;
; direction specifies the output direction of the fluid relative to the electrolyzer
; and references one of the possible values from the EnumFacing class:
;  - DOWN
;  - UP
;  - NORTH
;  - SOUTH
;  - WEST
;  - EAST
;
; If you want to specify the amount as well, you have to put the metadata there as well.
; OreDict:<OreDictName>*<amount>
; Fluid:<FluidName>*<amount>
;
; the metadata is specified as follows:
; - not at all -> metadata 0 is required or for ore-dictionary names their original metadata
; - * -> any metadata is allowed, overriding ore-dictionary metadata values to acccept any
; - <some number> -> the specific value is required, overriding ore-dictionary specifications
;
; You also need to specify the required EU consumption per tick:
;  @energy:<energy>
;
; You can also optionally specify the duration in ticks, with default of 200 ticks:
;  @duration:<ticks>
;
; Note: this is a Input = Output(s) mapping.
;
;---

; Hydrogen / Oxygen
Fluid:water*40 = Fluid:ic2hydrogen@down*26 Fluid:ic2oxygen@up*13 @energy:32