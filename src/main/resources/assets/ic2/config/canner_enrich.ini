; canner enrichment recipes
; created 23.11.2026 11:42:27
;
; To change/remove/add/replace recipes, modify this file and put it in the
; "minecraft/config/ic2" folder. Do NOT modify the file inside of the IC2-Patcher jar file.
;
; machine recipes are as follows:
;  <input fluid> <additive> = <output fluid>
;
; input fluid:
;  Fluid:<name>[*<amount>]
;
; additive:
; <name>[@metadata][*<amount>]
;
; output fluid:
;  Fluid:<name>[*<amount>]
;
; name references one of the following:
; - the global unique item name as introduced by MC 1.7 (mod id:registry name)
; - an ore dictionary entry with OreDict:<ore dict name>
; - a fluid [or fluid container item] for a fluid with Fluid:<fluid name>
;
; If you want to specify the amount as well, you have to put the metadata there as well.
; OreDict:<OreDictName>*<amount>
; Fluid:<FluidName>*<amount>
;
; the metadata is specified as follows:
; - not at all -> metadata 0 is required or for ore-dictionary names their original metadata
; - * -> any metadata is allowed, overriding ore-dictionary metadata values to acccept any
; - <some number> -> the specific value is required, overriding ore-dictionary specifications
;
; Note: this is a Input + Input = Output mapping.
;
;---

; Milk
Fluid:water ic2:dust#milk = Fluid:ic2milk

; Construction Foam
Fluid:water ic2:crafting#cf_powder = Fluid:ic2construction_foam

; Coolant
Fluid:water OreDict:dustLapis*8 = Fluid:ic2coolant

; Coolant from Distilled Water
Fluid:ic2distilled_water OreDict:dustLapis = Fluid:ic2coolant

; Biomass
Fluid:water ic2:crafting#bio_chaff = Fluid:ic2biomass

; Hot Water
Fluid:water*6000 minecraft:stick = Fluid:ic2hot_water
